name: Weekly scrapers

on:
  schedule:
    # Every Sunday at 12:45 Israel (UTC+3). GitHub cron is UTC, so this is 09:45 UTC.
    # After the winter clock change (UTC+2) this runs at 11:45 local.
    - cron: '45 9 * * 0'
  workflow_dispatch: # Run manually from GitHub on a computer or phone

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required so the bot can commit the new JSON files

    env:
      SKIP_GIT_PUSH: "1"
      DREAMCARD_HEADLESS: "1"
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
      BEHATSDAA_ID: ${{ secrets.BEHATSDAA_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      VISION_PROVIDER: deepseek-flash
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Behatsdaa scraper
        id: behatsdaa
        continue-on-error: true
        run: python -u scraper_behatsdaa.py

      - name: Run Pais Plus scraper
        id: pais
        continue-on-error: true
        run: python -u scraper_pais_plus.py

      - name: Run DreamCard scraper
        id: dreamcard
        continue-on-error: true
        run: python -u scrape_dreamcard.py

      - name: Commit and push scraped deals
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add cardsdeven/public/behatsdaa_deals.json cardsdeven/public/pais_plus_deals.json cardsdeven/public/dreamcard_deals.json
          git commit -m "chore: auto-update scraped deals" || echo "No changes to commit"
          git push

      - name: Fail if a scraper failed
        if: always() && (steps.behatsdaa.outcome == 'failure' || steps.pais.outcome == 'failure' || steps.dreamcard.outcome == 'failure')
        run: exit 1
